# TableRoad integration test environment.
#
#   docker compose -f docker/compose.yml up -d --build
#
# Direct access (host ports):  Postgres 15432, MySQL 13306, MariaDB 13307, Redis 16379, SSH 12222,
# SQL Server 11433 (sa / TableRoad!2026; the tests create the `tableroad` database), Vertica 15433 (dbadmin)
# Via the SSH bastion (user/pass tableroad/tableroad, or any key in docker/keys), the databases are
# reachable by service name only (postgres:5432, mysql:3306, mariadb:3306, redis:6379), which proves
# traffic really went through the tunnel.
name: tableroad-test

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tableroad
      POSTGRES_PASSWORD: tableroad
      POSTGRES_DB: tableroad
    ports: ["15432:5432"]
    volumes: ["./seed/postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tableroad"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4
    # 8.4 defaults to caching_sha2_password and has mysql_native_password disabled: exactly what we must support.
    environment:
      MYSQL_ROOT_PASSWORD: tableroad
      MYSQL_USER: tableroad
      MYSQL_PASSWORD: tableroad
      MYSQL_DATABASE: tableroad
    ports: ["13306:3306"]
    volumes: ["./seed/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptableroad"]
      interval: 2s
      retries: 60

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: tableroad
      MARIADB_USER: tableroad
      MARIADB_PASSWORD: tableroad
      MARIADB_DATABASE: tableroad
    ports: ["13307:3306"]
    volumes: ["./seed/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "tableroad"]
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tableroad", "ping"]
      interval: 2s
      retries: 30

  cockroach:
    image: cockroachdb/cockroach:v24.3.6
    command: start-single-node --insecure
    ports: ["26257:26257"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: tableroad
      CLICKHOUSE_PASSWORD: tableroad
      CLICKHOUSE_DB: tableroad
    ports: ["18123:8123"]

  libsql:
    image: ghcr.io/tursodatabase/libsql-server:latest
    ports: ["18080:8080"]

  # x86-only image: runs under Rosetta on Apple Silicon. Needs ~2 GB of Docker's memory.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TableRoad!2026"
      MSSQL_PID: Developer
    ports: ["11433:1433"]

  # Single-node Vertica (dbadmin, no password, database "tableroad"). 25.4 is the last release with the free
  # Community Edition licence; the vertica-k8s image is meant for the Kubernetes operator, so setup.sh creates
  # the database itself. x86 image (Rosetta); first start takes a couple of minutes.
  vertica:
    image: opentext/vertica-k8s:25.4.0-0
    platform: linux/amd64
    hostname: vertica
    user: "0"
    ports: ["15433:5433"]
    volumes: ["./vertica/setup.sh:/setup.sh:ro"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        grep -q "^dbadmin:" /etc/passwd || echo "dbadmin:x:$$(stat -c %u /opt/vertica/config):$$(stat -c %g /opt/vertica/config)::/home/dbadmin:/bin/bash" >> /etc/passwd;
        mkdir -p /data /home/dbadmin; chown -R $$(stat -c %u:%g /opt/vertica/config) /data /home/dbadmin;
        exec su dbadmin -c "USER=dbadmin /setup.sh"

  bastion:
    build: ./bastion
    ports: ["12222:22"]
    depends_on: [postgres, mysql, mariadb, redis]
