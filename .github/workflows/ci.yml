name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kit-tests:
    name: TableRoadKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # The app needs the macOS 26 SDK or later: use the newest Xcode on the image.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Test
        working-directory: Packages/TableRoadKit
        run: swift test

  app-build:
    name: macOS app build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # The app needs the macOS 26 SDK or later: use the newest Xcode on the image.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build (Debug)
        run: >
          xcodebuild -project TableRoad.xcodeproj -scheme TableRoad -configuration Debug
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
      # Release catches debug-only code (previews, fixtures) leaking into shipping builds.
      - name: Build (Release)
        run: >
          xcodebuild -project TableRoad.xcodeproj -scheme TableRoad -configuration Release
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

  format:
    name: swift-format lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      # The app needs the macOS 26 SDK or later: use the newest Xcode on the image.
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Lint
        run: swift format lint --strict --recursive Packages/TableRoadKit/Sources Packages/TableRoadKit/Tests Apps
